name: GPX tool image

on:
  push:
    branches: [main]
    tags: ['gpx-tool-v*']
    paths:
      - 'gpx-tool/**'
      - '.github/workflows/build-gpx-tool.yml'
      - '.github/workflows/_extension-image.yml'
  pull_request:
    paths:
      - 'gpx-tool/**'
      - '.github/workflows/build-gpx-tool.yml'
      - '.github/workflows/_extension-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag for a manual build (e.g. 1.2.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gpx-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/_extension-image.yml
    with:
      component: gpx-tool
      image: reitti-gpx-generator
      tag_prefix: gpx-tool
      version_file: gpx-tool/VERSION
      test_command: ''
      manual_tag: ${{ inputs.tag || '' }}
    secrets: inherit
