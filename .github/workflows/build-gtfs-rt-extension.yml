name: GTFS-RT extension image

on:
  push:
    branches: [main]
    tags: ['gtfs-rt-extension-v*']
    paths:
      - 'gtfs-rt-extension/**'
      - '.github/workflows/build-gtfs-rt-extension.yml'
      - '.github/workflows/_extension-image.yml'
  pull_request:
    paths:
      - 'gtfs-rt-extension/**'
      - '.github/workflows/build-gtfs-rt-extension.yml'
      - '.github/workflows/_extension-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag for a manual build (e.g. 1.2.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gtfs-rt-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/_extension-image.yml
    with:
      component: gtfs-rt-extension
      image: reitti-gtfs-rt-extension
      tag_prefix: gtfs-rt-extension
      version_file: gtfs-rt-extension/package.json
      test_command: npm test
      manual_tag: ${{ inputs.tag || '' }}
    secrets: inherit
