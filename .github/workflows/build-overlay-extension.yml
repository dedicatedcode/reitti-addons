name: Overlay extension image

on:
  push:
    branches: [main]
    tags: ['overlay-extension-v*']
    paths:
      - 'overlay-extension/**'
      - '.github/workflows/build-overlay-extension.yml'
      - '.github/workflows/_extension-image.yml'
  pull_request:
    paths:
      - 'overlay-extension/**'
      - '.github/workflows/build-overlay-extension.yml'
      - '.github/workflows/_extension-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag for a manual build (e.g. 1.2.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: overlay-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/_extension-image.yml
    with:
      component: overlay-extension
      image: reitti-overlay-extension
      tag_prefix: overlay-extension
      version_file: overlay-extension/package.json
      test_command: npm test
      manual_tag: ${{ inputs.tag || '' }}
    secrets: inherit
